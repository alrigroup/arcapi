<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALRI CWB | Secure Authentication</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/manager/login/style.css">
</head>

<body>
    <!-- Animated Mesh Background -->
    <div class="bg-mesh">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Top Navigation (Language & Theme) -->
    <div class="top-nav fade-in delay-1">
        <button class="icon-btn" onclick="toggleLanguage()" title="Language">
            <i class="fas fa-globe"></i> <span id="langText">PT-BR</span>
        </button>
        <div class="theme-dropdown">
            <button class="icon-btn" onclick="toggleThemeMenu()" title="Theme">
                <i class="fas fa-palette"></i>
            </button>
            <div class="theme-menu" id="themeMenu">
                <div class="color-dot" style="background: #ff003c;" onclick="setTheme('#ff003c', 'rgba(255,0,60,0.3)')">
                </div>
                <div class="color-dot" style="background: #0088ff;"
                    onclick="setTheme('#0088ff', 'rgba(0,136,255,0.3)')"></div>
                <div class="color-dot" style="background: #00ff41;" onclick="setTheme('#00ff41', 'rgba(0,255,65,0.3)')">
                </div>
                <div class="color-dot" style="background: #00f2ff;"
                    onclick="setTheme('#00f2ff', 'rgba(0,242,255,0.3)')"></div>
                <div class="color-dot" style="background: #bc00ff;"
                    onclick="setTheme('#bc00ff', 'rgba(188,0,255,0.3)')"></div>
                <div class="color-dot" style="background: #ffea00;"
                    onclick="setTheme('#ffea00', 'rgba(255,234,0,0.3)')"></div>
                <div class="color-dot" style="background: #ffffff;"
                    onclick="setTheme('#ffffff', 'rgba(255,255,255,0.3)')"></div>
            </div>
        </div>
    </div>

    <!-- Glassmorphism Login Card -->
    <div class="login-wrapper">
        <div class="glass-card fade-in delay-2">
            <div class="brand">
                <img src="https://i.ibb.co/Fk4sSC7X/ALRI-SF-W.png" alt="ALRI Group" class="logo">
                <h2 data-i18n="title">SECURE PORTAL</h2>
                <p data-i18n="subtitle">Authenticate to access the ALRI-CORE dashboard.</p>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group"><i class="fas fa-user"></i><input type="text" id="username" required
                        autocomplete="off" data-i18n-ph="ph_user"></div>
                <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="password" required
                        autocomplete="off" data-i18n-ph="ph_pass"></div>
                <div id="statusMessage" class="status-message"></div>
                <button type="submit" class="submit-btn" id="submitBtn"><span data-i18n="btn_login">ACCESS SYSTEM</span>
                    <i class="fas fa-arrow-right"></i></button>
            </form>
            <div class="footer-info"><i class="fas fa-shield-alt"></i> <span data-i18n="security_notice">E2EE
                    Client-Side Hashing Enabled</span></div>
        </div>
    </div>
    <script src="/manager/login/script.js"></script>
</body>

</html>
