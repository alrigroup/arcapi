<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCAPI | Login Manager</title>
    <link rel="stylesheet" href="/manager/login/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="theme-config">
        <button class="theme-btn" onclick="toggleLanguage()" id="langBtn" title="Idioma">
            <i class="fas fa-globe"></i> <span id="langText" style="font-size: 0.8rem; margin-left: 5px;">PT-BR</span>
        </button>
        <button class="theme-btn" onclick="toggleThemePanel()" title="Aparência">
            <i class="fas fa-cog"></i>
        </button>
        <div id="themePanel" class="theme-panel">
            <div class="color-dot" style="background: #ff003c;" onclick="setTheme('#ff003c', 'rgba(255,0,60,0.3)')" title="Vermelho"></div>
            <div class="color-dot" style="background: #0088ff;" onclick="setTheme('#0088ff', 'rgba(0,136,255,0.3)')" title="Azul"></div>
            <div class="color-dot" style="background: #00ff41;" onclick="setTheme('#00ff41', 'rgba(0,255,65,0.3)')" title="Verde"></div>
            <div class="color-dot" style="background: #00f2ff;" onclick="setTheme('#00f2ff', 'rgba(0,242,255,0.3)')" title="Ciano"></div>
            <div class="color-dot" style="background: #bc00ff;" onclick="setTheme('#bc00ff', 'rgba(188,0,255,0.3)')" title="Roxo"></div>
            <div class="color-dot" style="background: #ffea00;" onclick="setTheme('#ffea00', 'rgba(255,234,0,0.3)')" title="Amarelo"></div>
            <div class="color-dot" style="background: #ffffff;" onclick="setTheme('#ffffff', 'rgba(255,255,255,0.3)')" title="Branco"></div>
        </div>
    </div>
    <div class="login-box">
        <img src="https://i.ibb.co/Fk4sSC7X/ALRI-SF-W.png" alt="ALRI Group" class="login-logo">
        <div id="login-error"></div>
        <input type="text" id="login-user" placeholder="Username" autocomplete="off" autofocus data-i18n-ph="ph_user">
        <input type="password" id="login-pass" placeholder="Password" onkeydown="if(event.key==='Enter') doLogin()" data-i18n-ph="ph_pass">
        <button id="login-btn" onclick="doLogin()" data-i18n="login_btn">AUTHENTICATE</button>
        <div class="login-footer" data-i18n="login_footer">© 2026 ALRI Development // Secure Protocol</div>
    </div>

    <script src="/manager/login/script.js"></script>
</body>

</html>
