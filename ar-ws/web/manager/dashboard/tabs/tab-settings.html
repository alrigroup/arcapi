<div class="panel">
    <div class="panel-header">
        <h2 data-i18n="p_settings_h">SYSTEM: CONFIGURATIONS</h2>
    </div>
    <div class="panel-content">
        <div style="margin-bottom: 20px;">
            <strong style="color: var(--text-main);" data-i18n="p_settings_recompile_title">Manual System
                Recompilation</strong>
            <p style="color: var(--text-muted); font-size: 0.9em; margin-top: 5px;"
                data-i18n="p_settings_recompile_desc">Force the system to rebuild and restart modules. Requires ROOT
                privileges and Sudo confirmation.</p>
            <div style="margin-top: 15px; display: flex; gap: 15px;">
                <button class="btn-reload"
                    style="border-color: var(--warning); color: var(--warning); width: auto; padding: 10px 20px;"
                    onclick="actionSystemRestart('api')" data-i18n="btn_recompile_api">Recompile API</button>
                <button class="btn-reload"
                    style="border-color: var(--danger); color: var(--danger); width: auto; padding: 10px 20px;"
                    onclick="actionSystemRestart('core')" data-i18n="btn_recompile_core">Full Core Restart</button>
            </div>
        </div>
    </div>
</div>
